name: Feature request
description: 提议新的平台、指标或工作流能力
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 建议范围与验收条件
    validations:
      required: true
  - type: dropdown
    id: contract
    attributes:
      label: 是否影响数据契约
      options: [未知, 否, 是]
    validations:
      required: true
