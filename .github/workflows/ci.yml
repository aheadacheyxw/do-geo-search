name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package
        run: python -m pip install -e .
      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile Python sources
        run: python -m compileall -q geo_monitoring tests scripts
      - name: Check browser collector syntax
        run: node --check scripts/browser_evidence_collector.mjs
